<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Đảo Đèn Lồng</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root{--sky:#0E1430;--mist:#1B2350;--warm:#FFB347;--core:#FFE9B0;--gold:#F2C14E;--danger:#FF5A5F;--ui:#F5F1E6}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--sky);font-family:system-ui,"Segoe UI",sans-serif;color:var(--ui)}
  canvas{display:block}
  .hud{position:fixed;pointer-events:none;text-shadow:0 0 6px #000;font-size:18px}
  #flames{top:14px;left:16px;font-size:30px;color:var(--danger);letter-spacing:4px}
  #clock{top:12px;left:50%;transform:translateX(-50%);font-size:34px;font-weight:700;font-variant-numeric:tabular-nums}
  #clock.low{color:var(--danger);animation:blink .5s steps(2) infinite}
  @keyframes blink{50%{opacity:.25}}
  #right{top:14px;right:16px;text-align:right;line-height:1.5}
  #right b{color:var(--gold)}
  #bar{bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:4px}
  #bar i{width:22px;height:22px;border:2px solid var(--gold);border-radius:50%;background:transparent;box-sizing:border-box}
  #bar i.on{background:radial-gradient(#FFF6C2,#FFE58A);box-shadow:0 0 8px #FFE58A}
  #cds{bottom:16px;right:16px;display:flex;gap:10px}
  .cd{position:relative;width:62px;height:62px;border:2px solid var(--gold);border-radius:10px;background:rgba(14,20,48,.7);overflow:hidden;text-align:center;font-size:12px}
  .cd span{position:absolute;inset:auto 0 4px 0}.cd em{position:absolute;top:6px;left:0;right:0;font-style:normal;font-size:20px}
  .cd .fill{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.65);height:0}
  .cd.ready{box-shadow:0 0 10px var(--warm)}
  #prompt{bottom:70px;left:50%;transform:translateX(-50%);font-size:20px;color:var(--core);display:none}
  #msg{bottom:110px;left:16px;font-size:15px;opacity:.9;line-height:1.5}
  #warn{top:70px;left:50%;transform:translateX(-50%);color:#8FA3B8;font-size:22px;display:none}
  #arrow{position:fixed;width:0;height:0;pointer-events:none;display:none;border-left:14px solid transparent;border-right:14px solid transparent;border-bottom:34px solid var(--warm);filter:drop-shadow(0 0 6px #000)}
  #flash{position:fixed;inset:0;background:#5a1f8a;opacity:0;pointer-events:none;transition:opacity .3s}
  .screen{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;text-align:center;background:rgba(14,20,48,.82);gap:14px}
  .screen h1{margin:0;font-size:46px;color:var(--warm);text-shadow:0 0 18px #FFB34788}
  .screen h2{margin:0;font-size:32px;color:var(--gold)}
  .screen p{margin:0;max-width:520px;font-size:19px;line-height:1.5}
  .screen button{font-size:20px;padding:10px 28px;border:0;border-radius:8px;background:var(--warm);color:#1b1230;cursor:pointer;min-width:240px}
  .screen button.alt{background:var(--mist);color:var(--ui);border:1px solid var(--gold)}
  .screen label{font-size:18px;display:flex;gap:12px;align-items:center}
</style>
</head>
<body>
<div id="flames" class="hud"></div>
<div id="clock" class="hud"></div>
<div id="right" class="hud"></div>
<div id="bar" class="hud"></div>
<div id="cds" class="hud"><div class="cd" id="cdDash"><em>»</em><span>Lướt · Shift</span><div class="fill"></div></div><div class="cd" id="cdPulse"><em>✺</em><span>Tỏa Sáng · F</span><div class="fill"></div></div></div>
<div id="prompt" class="hud"></div>
<div id="msg" class="hud"></div>
<div id="warn" class="hud">Gió sắp nổi... lá đang bay</div>
<div id="arrow"></div>
<div id="flash"></div>

<div id="sMenu" class="screen"><h1>Đảo Đèn Lồng</h1><p>Mây, người giữ đèn nhỏ tuổi, phải thắp lại các Đèn Lồng Lớn trước khi bình minh.</p>
  <button id="bStart">Bắt đầu</button><button id="bSet1" class="alt">Cài đặt</button>
  <p style="font-size:14px;opacity:.7">WASD di chuyển · Space nhảy · Shift lướt · E nạp ánh sáng · F tỏa sáng · Esc/P tạm dừng · kéo chuột xoay camera</p></div>
<div id="sIntro" class="screen"><h2 id="iName"></h2><p id="iText"></p><button id="bBegin">Vào đêm</button></div>
<div id="sResult" class="screen"><h2 id="rTitle"></h2><p id="rText"></p><button id="bNext">Đêm kế tiếp</button><button id="bRetry" class="alt">Chơi lại đêm này</button><button id="bMenu1" class="alt">Về menu</button></div>
<div id="sDawn" class="screen"><h1>Bình Minh</h1><p id="dText"></p><button id="bMenu2">Về menu</button></div>
<div id="sPause" class="screen"><h2>Tạm dừng</h2><button id="bResume">Tiếp tục</button><button id="bRestart" class="alt">Chơi lại Đêm</button><button id="bSet2" class="alt">Cài đặt</button><button id="bMenu3" class="alt">Về menu</button></div>
<div id="sSet" class="screen"><h2>Cài đặt</h2>
  <label>Âm lượng <input id="vol" type="range" min="0" max="100"><span id="volV"></span></label>
  <label>Độ nhạy chuột <input id="sens" type="range" min="10" max="100"><span id="sensV"></span></label>
  <button id="bSetBack">Xong</button></div>
<script type="module" src="main.js"></script>
</body>
</html>
